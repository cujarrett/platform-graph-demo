name: promote-reviews

on:
  workflow_dispatch:

env:
  APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
  APOLLO_ELV2_LICENSE: accept

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@prod --name reviews --schema reviews/schema.graphql
      - uses: actions/checkout@v7
        with:
          repository: cujarrett/homelab-workspaces
          token: ${{ secrets.HOMELAB_WORKSPACES_TOKEN }}
          path: homelab-workspaces
      - run: |
          cd homelab-workspaces
          git checkout -b promote-reviews-$(date +%s)
          IMAGE=$(grep -oP 'ghcr\.io/cujarrett/platform-graph-demo-reviews@sha256:[0-9a-f]+' graph-preprod/reviews.yaml)
          sed -i "s|image: ghcr\.io/cujarrett/platform-graph-demo-reviews[:@].*|image: $IMAGE|" graph-prod/reviews.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "reviews: promote $IMAGE to prod"
          git push -u origin HEAD
          gh pr create --title "reviews: promote to prod" --body "Schema check against storefront-homelab@prod passed. Bumps graph-prod/reviews.yaml to the digest running in preprod."
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_WORKSPACES_TOKEN }}
