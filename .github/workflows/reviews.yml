name: reviews

on:
  push:
    branches: [main]
    paths: ["reviews/**", ".github/workflows/reviews.yml"]
  # Unfiltered, because branch protection requires reviews-test on every PR and a
  # required check that never runs blocks the merge.
  pull_request:
  workflow_dispatch:

jobs:
  reviews-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reviews
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The shared eslint config at the repo root resolves its imports from
      # the root node_modules, so the root install has to happen too.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  reviews-schema-check:
    # A check needs a published variant to compare against. The repo variable
    # GRAPH_READY is set to true once storefront-homelab@preprod exists, and
    # while this job is skipped, build-and-push and deploy are skipped too.
    if: vars.GRAPH_READY == 'true'
    runs-on: ubuntu-latest
    env:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_ELV2_LICENSE: accept
    steps:
      - uses: actions/checkout@v7
      - uses: apollographql/rover-actions/install-rover-cli@v1
      - run: rover subgraph check storefront-homelab@preprod --name reviews --schema reviews/schema.graphql

  build-and-push:
    needs: [reviews-test, reviews-schema-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: reviews
          platforms: linux/arm64
          push: true
          tags: ghcr.io/cujarrett/platform-graph-demo-reviews:sha-${{ github.sha }}
      # Signed by digest, because a tag can be moved after signing. This job
      # runs only on main, so a signature means the commit was reviewed.
      - run: cosign sign --yes ghcr.io/cujarrett/platform-graph-demo-reviews@${{ steps.build.outputs.digest }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cujarrett/homelab-workspaces
          token: ${{ secrets.HOMELAB_WORKSPACES_TOKEN }}
      - run: |
          sed -i "s|image: ghcr.io/cujarrett/platform-graph-demo-reviews[:@].*|image: ghcr.io/cujarrett/platform-graph-demo-reviews@${{ needs.build-and-push.outputs.digest }}|" graph-preprod/reviews.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "reviews: deploy ${{ needs.build-and-push.outputs.digest }}"
          git push
