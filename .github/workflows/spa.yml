name: spa

on:
  push:
    branches: [main]
    paths: ["spa/**", ".github/workflows/spa.yml"]
  # Unfiltered, because branch protection requires this job on every PR and a
  # required check that never runs blocks the merge.
  pull_request:
  workflow_dispatch:

jobs:
  spa-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: spa-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/platform-graph-demo-spa
      tags: |
        ghcr.io/cujarrett/platform-graph-demo-spa:latest
        ghcr.io/cujarrett/platform-graph-demo-spa:sha-${{ github.sha }}
      context: spa
      cache-scope: spa

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      image: ghcr.io/cujarrett/platform-graph-demo-spa
      file: platform-graph-demo/graph-demo.yaml
    secrets:
      app_private_key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
